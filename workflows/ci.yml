name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']        # pushing a tag like v0.2.0 also publishes a GitHub Release
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Qt, Ninja)
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build

      - name: Install Conan
        run: pipx install conan && conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}

      - name: Conan install
        run: >
          conan install . --build=missing
          -s build_type=${{ matrix.build_type }} -s compiler.cppstd=20
          -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure, build, test
        run: |
          preset=conan-$(echo ${{ matrix.build_type }} | tr '[:upper:]' '[:lower:]')
          cmake --preset $preset -DFITVIEWER_WARNINGS_AS_ERRORS=ON
          cmake --build --preset $preset
          ctest --preset $preset --output-on-failure

  appimage:
    needs: build-and-test   # only package code that passed the tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # needed to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history + tags, so `git describe` gives the version

      - name: Install system packages (Qt, Ninja)
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build

      - name: Install Conan
        run: pipx install conan && conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-Release-${{ hashFiles('conanfile.py') }}

      - name: Build AppImage
        run: |
          conan install . --build=missing -s build_type=Release -s compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset conan-release
          cmake --build --preset conan-release --target appimage

      - name: Upload AppImage as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fit-viewer-appimage
          path: build/Release/fit-viewer-*-x86_64.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/fit-viewer-*-x86_64.AppImage
          generate_release_notes: true
